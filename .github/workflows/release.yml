name: Build & Release AniCode

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Stable Version Tag (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Determine Tag & Release Type
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version_tag }}" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "TAG=v0.0.0-beta.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Generate Truncated Release Notes
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            LOGS=$(git log --oneline | head -n 30)
            TOTAL=$(git rev-list --count HEAD)
          else
            LOGS=$(git log "$LAST_TAG"..HEAD --oneline | head -n 30)
            TOTAL=$(git rev-list --count "$LAST_TAG"..HEAD)
          fi

          {
            echo "RELEASE_NOTES<<EOF"
            echo "### AniCode ${{ env.TAG }}"
            echo ""
            echo "$LOGS"
            if [ "$TOTAL" -gt 30 ]; then
              echo ""
              echo "*...and $((TOTAL - 30)) older commits (history truncated).*"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Compile Standalone Binary
        run: |
          cd packages/opencode
          bun run script/build.ts --single
          cd ../..

      - name: Package Binary
        run: |
          echo "Finding the compiled AniCode binary..."
          BIN_PATH=$(find dist packages/opencode/dist -type f \( -name "anicode" -o -name "opencode" \) -executable 2>/dev/null | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "Error: Failed to find the compiled binary."
            find dist packages/opencode/dist 2>/dev/null
            exit 1
          fi
          echo "Found binary at: $BIN_PATH"
          BIN_DIR=$(dirname "$BIN_PATH")
          BIN_FILE=$(basename "$BIN_PATH")
          tar -czvf anicode-linux-x64.tar.gz -C "$BIN_DIR" "$BIN_FILE"
          echo "ARCHIVE=anicode-linux-x64.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AniCode ${{ env.TAG }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: ${{ env.ARCHIVE }}
